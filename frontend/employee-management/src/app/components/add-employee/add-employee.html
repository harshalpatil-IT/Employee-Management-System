<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>{{ isEditMode ? 'Update Employee' : 'Add Employee' }}</h3>
        </div>

        <div class="card-body">

            <form #employeeForm="ngForm">

                <!-- Employee Name -->
                <div class="mb-3">
                    <label class="form-label">Employee Name</label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="employee.employee_name"
                        name="employee_name"
                        required
                        #employeeName="ngModel">

                    <div
                        class="text-danger mt-1"
                        *ngIf="employeeName.invalid && employeeName.touched">

                        Employee Name is required.

                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        class="form-control"
                        [(ngModel)]="employee.email"
                        name="email"
                        required
                        email
                        #email="ngModel">

                    <div
                        class="text-danger mt-1"
                        *ngIf="email.invalid && email.touched">

                        <span *ngIf="email.errors?.['required']">
                            Email is required.
                        </span>

                        <span *ngIf="email.errors?.['email']">
                            Enter a valid email address.
                        </span>

                    </div>
                </div>

                <!-- Department -->
                <div class="mb-3">
                    <label class="form-label">Department</label>

                    <select
                        class="form-select"
                        [(ngModel)]="employee.department"
                        name="department"
                        required
                        #department="ngModel">

                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Sales">Sales</option>

                    </select>

                    <div
                        class="text-danger mt-1"
                        *ngIf="department.invalid && department.touched">

                        Department is required.

                    </div>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">Phone</label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="employee.phone"
                        name="phone"
                        required
                        minlength="10"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        #phone="ngModel">

                    <div
                        class="text-danger mt-1"
                        *ngIf="phone.invalid && phone.touched">

                        <span *ngIf="phone.errors?.['required']">
                            Phone number is required.
                        </span>

                        <span *ngIf="phone.errors?.['pattern']">
                            Phone number must contain exactly 10 digits.
                        </span>

                    </div>
                </div>

                <!-- Status -->
                <div class="mb-3">
                    <label class="form-label">Status</label>

                    <select
                        class="form-select"
                        [(ngModel)]="employee.status_flag"
                        name="status_flag">

                        <option value="A">Active</option>
                        <option value="I">Inactive</option>

                    </select>
                </div>

                <!-- Joining Date -->
                <div class="mb-3">
                    <label class="form-label">Joining Date</label>

                    <input
                        type="date"
                        class="form-control"
                        [(ngModel)]="employee.joining_date"
                        name="joining_date"
                        required
                        #joiningDate="ngModel">

                    <div
                        class="text-danger mt-1"
                        *ngIf="joiningDate.invalid && joiningDate.touched">

                        Joining Date is required.

                    </div>
                </div>

                <!-- Buttons -->
              <div class="mt-3">

    <button
        class="btn btn-success me-2"
        type="button"
        (click)="saveEmployee()"
        [disabled]="employeeForm.invalid">

        {{ isEditMode ? 'Update Employee' : 'Save Employee' }}

    </button>

    <button
        class="btn btn-secondary me-2"
        type="button"
        (click)="cancel()">

        Cancel

    </button>

    <button
        class="btn btn-warning"
        type="reset">

        Clear

    </button>

</div>
            </form>

        </div>

    </div>

</div>
